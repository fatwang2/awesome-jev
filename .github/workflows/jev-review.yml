name: Jev review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Review with Jev
        id: review
        uses: fatwang2/jev-review-action@efd869a59fec09d4f6242cc7c3bbfab282ef0ec4 # Jev provider chain (typesafe, vercel, cloudflare) and listing stats
        with:
          # Repository variable JEV_PROVIDERS orders typesafe, vercel and cloudflare; unset means typesafe only.
          # Unlisted providers stay off even when their secrets exist; unset secrets are skipped.
          jev-providers: ${{ vars.JEV_PROVIDERS }}
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          ai-gateway-api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jev-review-${{ github.event.pull_request.number }}
          path: jev-report.json
          if-no-files-found: ignore
          retention-days: 14
