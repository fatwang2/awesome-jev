name: Jev review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Review with Jev
        id: review
        uses: fatwang2/jev-review-action@0b5613e7c6bfb5b9526948dd3da25ee4d929bdc9 # Review facts and pipeline-limit errors
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jev-review-${{ github.event.pull_request.number }}
          path: jev-report.json
          if-no-files-found: ignore
          retention-days: 14
